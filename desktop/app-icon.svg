<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dark Obsidian Gradient -->
    <linearGradient id="grad-obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1d21"/>
      <stop offset="100%" stop-color="#0b0c0e"/>
    </linearGradient>

    <!-- Subtle Rim Highlight -->
    <linearGradient id="border-obsidian" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- macOS HIG Native Contact Drop Shadow -->
    <filter id="shadow-mac" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Knockout Mask for Letter I (4px gap around r=22 dot) -->
    <mask id="icon-cutout-mask">
      <rect x="0" y="0" width="356" height="160" fill="#FFFFFF" />
      <circle cx="312" cy="138" r="26" fill="#000000" />
    </mask>
  </defs>

  <!-- Shadow Base -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000000" filter="url(#shadow-mac)"/>

  <!-- Squircle Body (824x824 at 100, 100 with rx=185) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#grad-obsidian)"/>

  <!-- Rim Highlight Border -->
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="url(#border-obsidian)" stroke-width="2"/>

  <!-- Official "API." Brand (Centered inside 824x824 squircle: scale 1.5x) -->
  <g transform="translate(245, 392) scale(1.5)">
    <g fill="#FFFFFF" mask="url(#icon-cutout-mask)">
      <!-- Letra A -->
      <path d="M 52.8 0 L 87.2 0 L 140 160 L 105.5 160 L 93.8 123 L 46.2 123 L 34.5 160 L 0 160 Z M 54.8 95 L 85.2 95 L 70 45 Z" fill-rule="evenodd" />

      <!-- Letra P -->
      <path d="M 152 0 L 208 0 C 234.5 0 252 16.5 252 45 C 252 73.5 234.5 90 208 90 L 184 90 L 184 160 L 152 160 Z M 184 28 L 184 62 L 205.5 62 C 216.5 62 221 55.5 221 45 C 221 34.5 216.5 28 205.5 28 Z" fill-rule="evenodd" />

      <!-- Letra I -->
      <rect x="268" y="0" width="32" height="160" />
    </g>

    <!-- Ponto Verde Característico Oficial -->
    <circle cx="312" cy="138" r="22" fill="#86BC25" />
  </g>
</svg>
