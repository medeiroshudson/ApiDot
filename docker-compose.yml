services:
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/apidot.db;Foreign Keys=True
      - APIDOT_VERSION=${APIDOT_VERSION:-dev}
      - APIDOT_AUTH_ENABLED=${APIDOT_AUTH_ENABLED:-true}
      - APIDOT_ROOT_EMAIL=${APIDOT_ROOT_EMAIL:-contato@hmedeiros.dev}
      - APIDOT_ROOT_PASSWORD=${APIDOT_ROOT_PASSWORD:-RootStrongPassword123!}
      # OIDC Configuration (optional)
      # - OIDC_AUTHORITY=https://auth.hmedeiros.dev/application/o/apidot/
      # - OIDC_CLIENT_ID=apidot
      # - OIDC_CLIENT_SECRET=
      # - OIDC_SCOPES=openid profile email
    volumes:
      - ./backend/data:/app/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - API_BASE_URL=http://server:5000
      - NEXT_PUBLIC_APP_VERSION=${APIDOT_VERSION:-dev}
    depends_on:
      - server
