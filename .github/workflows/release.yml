name: Release ApiDot (Containers & Agent)

on:
  push:
    tags:
      - 'v*'
      - 'dev'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0 or dev)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-containers:
    name: Build & Push Container (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: server
            image: ghcr.io/${{ github.repository }}-server
            dockerfile: ./backend/Dockerfile
            context: ./backend
          - component: web
            image: ghcr.io/${{ github.repository }}-web
            dockerfile: ./frontend/Dockerfile
            context: ./frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "dev" ]; then
            TAG="dev"
          else
            TAG="dev"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.tag }}
            APIDOT_VERSION=${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Write image reference to job summary
        run: |
          echo "### Component: ${{ matrix.component }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ matrix.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-agent-binaries:
    name: Build Agent (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
            binary_name: ApiDot.Agent
            asset_name: apidot-agent-osx-arm64
          - rid: linux-x64
            runner: ubuntu-latest
            binary_name: ApiDot.Agent
            asset_name: apidot-agent-linux-x64
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            binary_name: ApiDot.Agent
            asset_name: apidot-agent-linux-arm64
          - rid: win-x64
            runner: windows-latest
            binary_name: ApiDot.Agent.exe
            asset_name: apidot-agent-win-x64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Native AOT Agent
        run: |
          dotnet publish backend/src/ApiDot.Agent/ApiDot.Agent.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:InvariantGlobalization=true --self-contained -o ./publish

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifacts
          if [ ! -f "./publish/${{ matrix.binary_name }}" ]; then
            echo "Error: Output binary ./publish/${{ matrix.binary_name }} was not found!" >&2
            ls -la ./publish/ || true
            exit 1
          fi
          cp "./publish/${{ matrix.binary_name }}" "./artifacts/${{ matrix.asset_name }}"
          chmod +x "./artifacts/${{ matrix.asset_name }}" || true
          ls -la ./artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./artifacts/${{ matrix.asset_name }}
          retention-days: 1
          if-no-files-found: error

  publish-github-release:
    name: Publish Release to GitHub
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build-and-push-containers, build-agent-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'apidot-agent-*'
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - name: Determine release tag
        id: release-tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Release tag must be provided via input (tag_name) or the workflow must run on a 'v*' tag (got ref: $REF_NAME)." >&2
            exit 1
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ steps.release-tag.outputs.tag == 'dev' }}
          body: |
            ## Docker Container Images (GHCR)
            - `ghcr.io/${{ github.repository }}-server:${{ steps.release-tag.outputs.tag }}`
            - `ghcr.io/${{ github.repository }}-web:${{ steps.release-tag.outputs.tag }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
