name: Release ApiDot Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.5.1)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rid: osx-arm64
            binary_name: ApiDot.Agent
          - platform: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            rid: osx-x64
            binary_name: ApiDot.Agent
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            binary_name: ApiDot.Agent
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            rid: win-x64
            binary_name: ApiDot.Agent.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_NAME" == v* ]]; then
            TAG="$REF_NAME"
          else
            TAG="$REF_NAME"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Publish Native AOT Agent
        run: |
          dotnet publish backend/src/ApiDot.Agent/ApiDot.Agent.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:InvariantGlobalization=true --self-contained -o ./agent-publish

      - name: Build frontend static export
        env:
          NEXT_PUBLIC_APIDOT_API_BASE: ${{ vars.APIDOT_API_BASE || 'https://apidot.hmedeiros.dev' }}
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build:desktop

      - name: Prepare Desktop Environment
        shell: bash
        env:
          APIDOT_TARGET_TRIPLE: ${{ matrix.target }}
          APIDOT_AGENT_BINARY_PATH: ${{ github.workspace }}/agent-publish/${{ matrix.binary_name }}
          NEXT_PUBLIC_APIDOT_API_BASE: ${{ vars.APIDOT_API_BASE || 'https://apidot.hmedeiros.dev' }}
        run: |
          node desktop/prepare.js

      - name: Install Desktop dependencies
        run: npm --prefix desktop install

      - name: Validate desktop release configuration
        run: node desktop/validate-config.js
        env:
          APIDOT_REQUIRE_UPDATER_KEY: 'true'

      - name: Build Desktop Application and Create Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ steps.version.outputs.tag }}
          args: --target ${{ matrix.target }}
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
